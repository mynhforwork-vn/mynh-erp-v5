name: Remediation QA

on:
  push:
    branches:
      - fix/76aed41c-remediation
      - feat/tracking-telegram-production
      - feat/tracking-settings-spx-v1
      - feat/alerts-v1
      - redesign/settings-v6
      - redesign/settings-v8
      - redesign/account-notifications-v1
      - fix/order-text-recognition-v1
      - fix/voucher-tags-main-v2
      - fix/manual-tracking-response-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/remediation-static-qa.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run build
