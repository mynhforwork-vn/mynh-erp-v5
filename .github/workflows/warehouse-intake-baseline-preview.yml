name: Warehouse Intake Baseline Preview 2026-11-06

on:
  push:
    branches:
      - preview/warehouse-intake-baseline-20261106
    paths:
      - '.github/workflows/warehouse-intake-baseline-preview.yml'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'open-next.config.ts'

permissions:
  contents: read

concurrency:
  group: warehouse-intake-baseline-preview-20261106
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Cloudflare authentication is configured
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Build OpenNext from unmodified main app
        run: npx opennextjs-cloudflare build
      - name: Publish dedicated Preview only (never Production)
        id: preview
        shell: bash
        run: |
          npx wrangler preview --name warehouse-intake-baseline-20261106 --worker-name mynh-erp-v5 --message "Warehouse intake baseline from main 96029492250b078d3ec182578297401160ca3bdd" --json > warehouse-preview-result.json
          node - <<'NODE'
          const fs = require('fs')
          const str = fs.readFileSync('warehouse-preview-result.json', 'utf8')
          const data = JSON.parse(str.slice(str.indexOf('{'), str.lastIndexOf('}')+1))
          const urls=[]
          function visit(x) {
            if(typeof x === 'string' && x.startsWith('https://')) urls.push(x)
            else if(Array.isArray(x)) x.forEach(visit)
            else if(x && typeof x === 'object') Object.values(x).forEach(visit)
          }
          visit(data)
          const url=urls.find(x=>x.includes('warehouse-intake-baseline-20261106') && x.includes('workers.dev'))
          if(!url) throw new Error('Expected dedicated Preview URL not returned')
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'url='+url+'\n')
          console.log('Preview URL: '+url)
          NODE
      - name: Read-only health and login smoke
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$PREVIEW_URL/api/health" > health.json
          grep -q '"ok":true' health.json
          code=$(curl -L -sS -o login.html -w '%{http_code}' "$PREVIEW_URL/login")
          test "$code" = 200
          grep -q 'MYNH ERP' login.html
      - name: Summary
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          {
            echo "## Warehouse Intake Preview"
            echo "- App source: main 96029492250b078d3ec182578297401160ca3bdd (plus workflow only)"
            echo "- Branch: preview/warehouse-intake-baseline-20261106"
            echo "- Preview: $PREVIEW_URL"
            echo "- Typecheck, OpenNext build, /api/health and /login: PASS"
            echo "- No Production or Supabase changes"
          } >> "$GITHUB_STEP_SUMMARY"
