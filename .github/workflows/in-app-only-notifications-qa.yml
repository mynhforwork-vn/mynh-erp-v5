name: In-app Notifications Only QA

on:
  push:
    branches:
      - fix/remove-telegram-notifications-20261012
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: in-app-only-notifications-qa
  cancel-in-progress: true

jobs:
  in-app-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PREVIEW_URL: https://in-app-only-qa-v1-mynh-erp-v5.mynh-forwork.workers.dev
      SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
      SUPABASE_KEY: sb_publishable_HNOcPFxwK51DKxAmy5fQhw_89dNfMOS
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate in-app-only notification and legacy contracts
        run: |
          node scripts/notification-in-app-only-qa.mjs
          node scripts/remediation-static-qa.mjs
          node --experimental-strip-types scripts/notification-production-qa.mjs
          node --experimental-strip-types scripts/table-platform-p0-qa.mjs
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Build Worker without Production deployment
        run: npx opennextjs-cloudflare build
      - name: Publish ISOLATED in-app-only Preview
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler preview --name in-app-only-qa-v1 --worker-name mynh-erp-v5 --message "In-app alerts only $GITHUB_SHA" --json > inapp-preview.json
      - name: Preview health and login smoke
        run: |
          test "$(curl --silent --show-error --max-time 25 -o health.json -w '%{http_code}' "$PREVIEW_URL/api/health")" = "200"
          grep -q '"ok":true' health.json
          test "$(curl --silent --show-error --max-time 25 -o login.html -w '%{http_code}' "$PREVIEW_URL/login")" = "200"
      - name: Create temporary QA operator
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/preview-auth-setup.mjs
      - name: Install Chrome QA
        run: |
          npm install --no-save playwright --no-audit --no-fund
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_BIN=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Authenticated mobile, tablet and desktop notification regression
        run: node scripts/notification-in-app-only-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: in-app-notification-qa-${{ github.sha }}
          path: qa-notification-artifacts/
          retention-days: 7
          if-no-files-found: ignore
      - name: Cleanup temporary QA operator
        if: always()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/preview-auth-cleanup.mjs
