name: Build Check

on:
  push:
    branches:
      - feature/finance-ledger-v1
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_HNOcPFxwK51DKxAmy5fQhw_89dNfMOS
      - run: npx @opennextjs/cloudflare build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_HNOcPFxwK51DKxAmy5fQhw_89dNfMOS
      - run: npx wrangler deploy --dry-run
