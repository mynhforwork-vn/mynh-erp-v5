name: Cleanup Preview QA Users

on:
  push:
    branches:
      - fix/76aed41c-remediation
    paths:
      - .github/workflows/qa-cleanup-once.yml

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Delete exact temporary QA users
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error --retry 3             https://nvgxwqapfaslavhtpauh.supabase.co/functions/v1/qa-cleanup-preview)
          echo "$body"
          echo "$body" | grep -q '"ok":true'
