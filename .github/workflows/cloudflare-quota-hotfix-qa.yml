name: Cloudflare Quota Hotfix QA
on:
  push:
    branches:
      - fix/cloudflare-request-quota
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Static QA
        run: node scripts/remediation-static-qa.mjs
      - name: Next.js build
        run: npm run build
      - name: Verify tracking-gated two-minute polling budget
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          const source=fs.readFileSync('components/in-app-alert-center.tsx','utf8')
          const layout=fs.readFileSync('app/(erp)/layout.tsx','utf8')
          const settings=fs.readFileSync('components/tracking-settings.tsx','utf8')
          const guards=[
            'const NOTIFICATION_POLL_MS=120000',
            'const [trackingEnabled,setTrackingEnabled]=useState(initialTrackingEnabled)',
            'notificationsEnabled===true&&trackingEnabled===true',
            'if(notificationsEnabled!==true||trackingEnabled!==true)',
            'pendingRequest.current?.abort()',
            "window.addEventListener('storage',onTrackingStorage)",
            "window.addEventListener('mynh-erp-tracking-changed',onTrackingChanged)",
            'nextAllowedAt.current=Date.now()+900000',
            'requestInFlight.current',
          ]
          for(const guard of guards)assert.ok(source.includes(guard),'Missing polling guard: '+guard)
          assert.ok(layout.includes(".from('tracking_runtime_settings')"))
          assert.ok(layout.includes("trackingRuntime?.auto_tracking_enabled===true"))
          assert.ok(layout.includes('<InAppAlertCenter trackingEnabled={trackingEnabled}/>'))
          assert.ok(settings.includes('await saveTrackingRuntimeSettings(formData)'))
          assert.ok(settings.includes("window.dispatchEvent(new CustomEvent('mynh-erp-tracking-changed'"))
          assert.equal(24*60/2,720)
          assert.equal(8*60/2,240)
          console.log('PASS: Tracking OFF or notifications OFF = zero scheduled alert requests; ON = 2-minute polling (720/day for 24h)')
          NODE
