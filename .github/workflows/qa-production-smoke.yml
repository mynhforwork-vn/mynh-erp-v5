name: QA production smoke

on:
  push:
    branches:
      - qa/full-system-2026-10-05

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health
        run: |
          set -euxo pipefail
          curl -fsS https://mynh-erp-v5.mynh-forwork.workers.dev/api/health | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
      - name: Login page
        run: |
          set -euxo pipefail
          code=$(curl -sS -o /tmp/login.html -w "%{http_code}" https://mynh-erp-v5.mynh-forwork.workers.dev/login)
          test "$code" = "200"
          grep -q "MYNH ERP" /tmp/login.html
      - name: Protected routes redirect
        run: |
          set -euxo pipefail
          for path in / /purchase /warehouse /sales /finance /settings /account; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "https://mynh-erp-v5.mynh-forwork.workers.dev$path")
            echo "$path => $code"
            case "$code" in 301|302|303|307|308) ;; *) exit 1 ;; esac
          done
