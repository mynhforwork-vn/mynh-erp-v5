name: QA Kho POS Tai chinh RBAC Luu du lieu
on:
  push:
    branches:
      - qa/full-ops-inapp-no-telegram-20261012
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-full-ops-inapp-20261012
  cancel-in-progress: false

jobs:
  ops-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      PREVIEW_URL: https://ops-full-qa-v1-mynh-erp-v5.mynh-forwork.workers.dev
      SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
      SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate prerequisites
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Read-only regression and module contracts
        run: |
          node scripts/notification-in-app-only-qa.mjs
          node scripts/remediation-static-qa.mjs
          node --experimental-strip-types scripts/destination-hub-routing-qa.mjs
          node --experimental-strip-types scripts/notification-production-qa.mjs
          node --experimental-strip-types scripts/table-platform-p0-qa.mjs
          node --experimental-strip-types scripts/p1-purchase-static-qa.mjs
          node --experimental-strip-types scripts/order-prepaid-qa.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build WITHOUT Production deployment
        run: npx opennextjs-cloudflare build
      - name: Publish dedicated named Preview ONLY
        run: |
          npx wrangler preview --name ops-full-qa-v1 --worker-name mynh-erp-v5 --message "ops E2E QA $GITHUB_SHA" --json > qa-ops-preview.json
      - name: Preview smoke
        run: |
          test "$(curl --silent --show-error --max-time 25 -o health.json -w '%{http_code}' "$PREVIEW_URL/api/health")" = "200"
          grep -q '"ok":true' health.json
          test "$(curl --silent --show-error --max-time 25 -o login.html -w '%{http_code}' "$PREVIEW_URL/login")" = "200"
      - name: Create isolated temporary QA user
        run: node scripts/preview-auth-setup.mjs
      - name: Create unique test fixtures
        run: node scripts/preview-fixture-setup.mjs
      - name: Install Playwright Chrome
        run: |
          npm install --no-save playwright --no-audit --no-fund
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_BIN=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: UI end-to-end all modules + responsive
        id: browser
        continue-on-error: true
        run: node scripts/preview-browser-qa.mjs
      - name: Warehouse POS debt and finance posting persistence E2E
        id: mutations1
        continue-on-error: true
        run: node scripts/preview-mutation-qa.mjs
      - name: POS refund stocktake transfer HUB reconciliation E2E
        id: mutations2
        continue-on-error: true
        run: node scripts/preview-mutation-qa-v2.mjs
      - name: Admin operator viewer UI API RLS persistence
        id: rbac
        continue-on-error: true
        run: node scripts/preview-rbac-qa.mjs
      - name: Upload QA evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-ops-inapp-${{ github.sha }}
          path: |
            qa-browser-artifacts/
            qa-mutation-artifacts/
            qa-mutation-v2-artifacts/
            qa-rbac-artifacts/
          if-no-files-found: ignore
          retention-days: 10
      - name: Clean ONLY uniquely tagged QA fixtures
        if: always()
        run: node scripts/preview-fixture-cleanup.mjs
      - name: Clean temporary QA user
        if: always()
        run: node scripts/preview-auth-cleanup.mjs
      - name: Overall test result
        if: always()
        run: |
          echo "Browser: ${{ steps.browser.outcome }}"
          echo "Warehouse/POS/Finance: ${{ steps.mutations1.outcome }}"
          echo "POS returns/warehouse transfer/HUB: ${{ steps.mutations2.outcome }}"
          echo "RBAC: ${{ steps.rbac.outcome }}"
          test "${{ steps.browser.outcome }}" = "success"
          test "${{ steps.mutations1.outcome }}" = "success"
          test "${{ steps.mutations2.outcome }}" = "success"
          test "${{ steps.rbac.outcome }}" = "success"
