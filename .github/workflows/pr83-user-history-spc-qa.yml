name: PR83 User history + SPC secure copy Preview
on:
  push:
    branches: [feat/user-history-diff-spc-copy-20261104]
permissions:
  contents: read
concurrency:
  group: pr83-user-history-spc-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PREVIEW_URL: https://user-history-spc-qa-v1-mynh-erp-v5.mynh-forwork.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Offline history and SPC security QA
        run: |
          node --experimental-strip-types scripts/user-history-spc-security-qa.mjs
          npm run typecheck
      - name: Build isolated Preview
        run: npx opennextjs-cloudflare build
      - name: Publish isolated Preview (no Production deploy)
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler preview --name user-history-spc-qa-v1 --worker-name mynh-erp-v5 --message "PR83 history SPC QA $GITHUB_SHA" --json > pr83-preview.json
      - name: Preview smoke: health and login
        run: |
          test "$(curl -fsS --max-time 30 -o pr83-health.json -w '%{http_code}' "$PREVIEW_URL/api/health")" = "200"
          grep -q '"ok":true' pr83-health.json
          test "$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "$PREVIEW_URL/login")" = "200"
# SQL 0073 is not applied to Production and the SPC endpoint's authenticated happy path is NOT E2E verified.
