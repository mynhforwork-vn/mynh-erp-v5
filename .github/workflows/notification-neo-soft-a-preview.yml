name: MYNH Notification Neo Soft A Preview
on:
  push:
    branches:
      - preview/notification-neo-soft-a
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mynh-notification-neo-soft-a
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_URL: https://mynh-erp-neo-soft-a.mynh-forwork.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm Cloudflare preview access
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: QA Desktop modules
        run: node scripts/remediation-static-qa.mjs
      - name: QA quiet hours 02–06 Vietnam and 5-minute polling
        run: node --experimental-strip-types scripts/notification-quiet-hours-qa.mjs
      - name: QA grouped alerts, R00 hidden and action/read separation
        run: node --experimental-strip-types scripts/notification-order-presentation-qa.mjs
      - name: QA missing MVD and post-receipt intake action groups
        run: node --experimental-strip-types scripts/notification-order-tasks-qa.mjs
      - name: QA Neo Soft A HUB filter, details, isolated styling
        run: node scripts/notification-neo-soft-a-qa.mjs
      - name: Build OpenNext for isolated Worker
        run: npx opennextjs-cloudflare build
      - name: Deploy Neo Soft A Worker only
        run: npx wrangler deploy --config wrangler.neo-soft-a.jsonc
      - name: Smoke test new Preview without data mutation
        run: |
          code=000
          for attempt in $(seq 1 16); do
            code=$(curl -sS --max-time 18 -o health.json -w '%{http_code}' "$PREVIEW_URL/api/health") || code=000
            echo "NEO_SOFT_HEALTH_ATTEMPT_${attempt} $code"
            if test "$code" = "200"; then break; fi
            sleep 5
          done
          echo "NEO_SOFT_HEALTH_HTTP $code"
          test "$code" = "200"
          grep -q '"ok":true' health.json
          login_code=$(curl -sS --retry 3 --retry-all-errors --retry-delay 3 --max-time 18 -o login.html -w '%{http_code}' "$PREVIEW_URL/login")
          echo "NEO_SOFT_LOGIN_HTTP $login_code"
          test "$login_code" = "200"
          grep -q 'MYNH ERP' login.html
          account_code=$(curl -sS --retry 3 --retry-all-errors --retry-delay 3 --max-time 18 -o /dev/null -w '%{http_code}' "$PREVIEW_URL/purchase/accounts?mode=create")
          echo "NEO_SOFT_GUEST_ACCOUNT_HTTP $account_code"
          test "$account_code" = "307" -o "$account_code" = "302"
      - name: QA summary
        if: always()
        run: |
          {
            echo '## Neo Soft A — MYNH ERP notification Preview'
            echo ''
            echo "- Preview URL: $PREVIEW_URL"
            echo "- Branch: `preview/notification-neo-soft-a`"
            echo "- SHA: `$GITHUB_SHA`"
            echo '- Design: Neo Soft A, HUB filter, in-drawer order details'
            echo '- ERP production and PR56 preview: unchanged'
            echo '- Supabase migration and business data: unchanged'
          } >> "$GITHUB_STEP_SUMMARY"
