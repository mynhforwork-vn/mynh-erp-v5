name: PR79 Isolated Notification Browser QA
on:
  push:
    branches:
      - fix/persistent-delivery-failed-reminder-20261014
    paths:
      - 'app/**'
      - 'components/in-app-alert-center.tsx'
      - 'app/styles/notification-neo-soft-a.css'
      - 'lib/notification-*.ts'
      - 'scripts/notification-pr79-browser-qa.mjs'
      - 'supabase/migrations/0070_persistent_failed_delivery_reminders.sql'
      - 'supabase/migrations/0071_operational_system_notifications.sql'
      - '.github/workflows/notification-pr79-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr79-isolated-notification-browser
  cancel-in-progress: true
jobs:
  notification-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PREVIEW_URL: https://notification-pr79-qa-mynh-erp-v5.mynh-forwork.workers.dev
      SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
      SUPABASE_KEY: sb_publishable_HNOcPFxwK51DKxAmy5fQhw_89dNfMOS
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Offline notification contracts
        run: |
          node --experimental-strip-types scripts/notification-order-presentation-qa.mjs
          node scripts/delivery-failure-notification-contract-qa.mjs
          node scripts/notification-system-contract-qa.mjs
      - name: Build isolated Preview Worker
        run: npx opennextjs-cloudflare build
      - name: Upload isolated Preview, never activate Production
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler preview --name notification-pr79-qa --worker-name mynh-erp-v5 --message "PR79 notification QA $GITHUB_SHA" --json > pr79-preview.json
          node -e "const x=require('./pr79-preview.json');console.log('PREVIEW_VERSION',x.version_id||x.id||'uploaded')"
      - name: Preview HTTP health and login smoke
        run: |
          test "$(curl --silent --show-error --max-time 25 -o health-pr79.json -w '%{http_code}' "$PREVIEW_URL/api/health")" = "200"
          grep -q '"ok":true' health-pr79.json
          test "$(curl --silent --show-error --max-time 25 -o login-pr79.html -w '%{http_code}' "$PREVIEW_URL/login")" = "200"
      - name: Install Chromium UI QA
        run: |
          npm install --no-save playwright --no-audit --no-fund
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_BIN=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Create temporary QA operator (no orders changed)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/preview-auth-setup.mjs
      - name: Responsive notification bell, filters, alert API, no reload
        run: node scripts/notification-pr79-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr79-notifications-qa-${{ github.sha }}
          path: qa-pr79-notification-artifacts/
          retention-days: 7
          if-no-files-found: ignore
      - name: Cleanup temporary QA operator
        if: always()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/preview-auth-cleanup.mjs
