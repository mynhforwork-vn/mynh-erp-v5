name: Cloudflare Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://mynh-erp-v5.mynh-forwork.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret" && exit 1)

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Static QA
        run: node scripts/remediation-static-qa.mjs

      - name: Build OpenNext Worker
        run: npx opennextjs-cloudflare build

      - name: Deploy production Worker
        shell: bash
        run: npx opennextjs-cloudflare deploy

      - name: Smoke production
        shell: bash
        run: |
          echo "Smoke $PRODUCTION_URL"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$PRODUCTION_URL/api/health" | tee health.json
          grep -q '"ok":true' health.json
          code=$(curl -sS -o login.html -w '%{http_code}' "$PRODUCTION_URL/login")
          test "$code" = "200"
          grep -q 'MYNH ERP' login.html

      - name: Production summary
        shell: bash
        run: |
          {
            echo "## Cloudflare Production"
            echo ""
            echo "- Commit: `$GITHUB_SHA`"
            echo "- Worker: `mynh-erp-v5`"
            echo "- URL: $PRODUCTION_URL"
            echo "- Static QA: PASS"
            echo "- OpenNext build: PASS"
            echo "- /api/health: PASS"
            echo "- /login: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
