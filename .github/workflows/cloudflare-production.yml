name: Cloudflare Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret" && exit 1)

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Static QA
        run: node scripts/remediation-static-qa.mjs

      - name: Build OpenNext Worker
        run: npx opennextjs-cloudflare build

      - name: Deploy production Worker
        id: deploy
        shell: bash
        run: |
          npx wrangler deploy             --name mynh-erp-v5             --message "Production $GITHUB_SHA"             --json | tee cloudflare-production.json

          node - <<'NODE'
          const fs=require('fs')
          const raw=fs.readFileSync('cloudflare-production.json','utf8')
          let data
          try{data=JSON.parse(raw)}catch{
            const start=raw.indexOf('{'),end=raw.lastIndexOf('}')
            if(start<0||end<start)throw new Error('Wrangler did not return JSON')
            data=JSON.parse(raw.slice(start,end+1))
          }
          const urls=[]
          const visit=x=>{
            if(!x)return
            if(typeof x==='string'&&/^https:\/\//.test(x))urls.push(x)
            else if(Array.isArray(x))x.forEach(visit)
            else if(typeof x==='object')Object.values(x).forEach(visit)
          }
          visit(data)
          const url=urls.find(x=>x.includes('workers.dev'))||urls[0]||'https://mynh-erp-v5.mynh-forwork.workers.dev'
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`url=${url}\n`)
          console.log(`Production URL: ${url}`)
          NODE

      - name: Smoke production
        shell: bash
        env:
          PRODUCTION_URL: https://mynh-erp-v5.mynh-forwork.workers.dev
        run: |
          echo "Smoke $PRODUCTION_URL"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$PRODUCTION_URL/api/health" | tee health.json
          grep -q '"ok":true' health.json
          code=$(curl -sS -o login.html -w '%{http_code}' "$PRODUCTION_URL/login")
          test "$code" = "200"
          grep -q 'MYNH ERP' login.html

      - name: Production summary
        shell: bash
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "## Cloudflare Production"
            echo ""
            echo "- Commit: `$GITHUB_SHA`"
            echo "- Worker: `mynh-erp-v5`"
            echo "- URL: $PRODUCTION_URL"
            echo "- Static QA: PASS"
            echo "- OpenNext build: PASS"
            echo "- /api/health: PASS"
            echo "- /login: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
