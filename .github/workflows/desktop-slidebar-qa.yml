name: Desktop Slidebar QA

on:
  push:
    branches:
      - fix/desktop-polish-v1
    paths:
      - app/**
      - components/**
      - scripts/desktop-slidebar-qa.mjs
      - scripts/preview-auth-setup.mjs
      - scripts/preview-auth-cleanup.mjs
      - scripts/preview-fixture-setup.mjs
      - scripts/preview-fixture-cleanup.mjs
      - .github/workflows/desktop-slidebar-qa.yml
  workflow_dispatch:

concurrency:
  group: desktop-slidebar-qa
  cancel-in-progress: true

jobs:
  slidebar-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_URL: https://desktop-polish-v1-mynh-erp-v5.mynh-forwork.workers.dev
      SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
      SUPABASE_KEY: sb_publishable_HNOcPFxwK51DKxAmy5fQhw_89dNfMOS
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Wait for matching Cloudflare Preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const repo=process.env.GITHUB_REPOSITORY
          const sha=process.env.GITHUB_SHA
          const token=process.env.GH_TOKEN
          const headers={Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'}
          const sleep=ms=>new Promise(r=>setTimeout(r,ms))
          for(let attempt=1;attempt<=60;attempt++){
            const url='https://api.github.com/repos/'+repo+'/actions/workflows/cloudflare-remediation-preview.yml/runs?head_sha='+sha+'&per_page=10'
            const res=await fetch(url,{headers})
            const data=await res.json()
            const runs=(data.workflow_runs??[]).filter(x=>x.head_sha===sha)
            if(runs.some(x=>x.status==='completed'&&x.conclusion==='success'))process.exit(0)
            const active=runs.some(x=>['queued','in_progress','waiting','requested'].includes(x.status))
            if(runs.length&&!active&&runs.every(x=>x.status==='completed'))throw new Error('Preview failed for '+sha)
            await sleep(10000)
          }
          throw new Error('Timed out waiting preview '+sha)
          NODE

      - name: Create temporary QA auth session
        run: node scripts/preview-auth-setup.mjs

      - name: Create isolated QA fixtures
        run: node scripts/preview-fixture-setup.mjs

      - name: Prepare Playwright with system Chrome
        shell: bash
        run: |
          npm install --no-save playwright
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "::error::System Chrome/Chromium not found"
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Run focused desktop slidebar QA
        run: node scripts/desktop-slidebar-qa.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-slidebar-qa-${{ github.sha }}
          path: qa-desktop-slidebar-artifacts/
          retention-days: 7

      - name: Cleanup isolated QA fixtures
        if: always()
        run: node scripts/preview-fixture-cleanup.mjs

      - name: Cleanup temporary QA auth user
        if: always()
        run: node scripts/preview-auth-cleanup.mjs
