name: PR93 PR94 Approved Warehouse SKU Production One-Shot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pr94-warehouse-sku-production-one-shot.yml'
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: "${{ github.event.head_commit.message == 'release(warehouse): approved PR93 PR94 production one-shot' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://mynh-erp-v5.mynh-forwork.workers.dev
      PRODUCTION_ALIAS: https://erp.mynh-forwork.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard exact reviewed main SHA and one-shot-only content
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD^)" = '216907e080ff25300fe2b2664d1758fc9d52b5cb'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/pr94-warehouse-sku-production-one-shot.yml'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -f supabase/migrations/0078_sku_catalog_safe_merge.sql
          node - <<'NODE'
          const cfg=JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8'))
          if(cfg.name!=='mynh-erp-v5'||cfg.vars.ERP_WAREHOUSE_V2_LIVE!=='true'||
             cfg.vars.ERP_SKU_CATALOG_LIVE!=='true'||
             cfg.previews.vars.ERP_SKU_CATALOG_LIVE!=='false'||
             cfg.previews.vars.ERP_WAREHOUSE_V2_LIVE!=='false'){
              throw Error('ERP production/preview gates do not match approved release')
          }
          console.log('PASS exact Worker name and production/preview write gates')
          NODE
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Warehouse SKU, responsive and adjacent-module static QA
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sku-catalog-contract-qa.mjs
          node scripts/warehouse-intake-preview-contract-qa.mjs
          node scripts/warehouse-sku-suggestion-qa.mjs
          node scripts/warehouse-bulk-action-qa.mjs
          node --experimental-strip-types scripts/returned-shipment-cancellation-qa.mjs
          node --experimental-strip-types scripts/notification-order-presentation-qa.mjs
          node scripts/remediation-static-qa.mjs
          npm run typecheck
      - name: OpenNext build and deploy only mynh-erp-v5
        shell: bash
        run: |
          set -euo pipefail
          npx opennextjs-cloudflare build
          npx opennextjs-cloudflare deploy
      - name: Production and alias HTTP read-only diagnostics
        shell: bash
        run: |
          set -euo pipefail
          for base in "$PRODUCTION_URL" "$PRODUCTION_ALIAS"; do
            for endpoint in /api/health /login /warehouse/skus /api/alerts/in-app; do
              code=000
              for attempt in 1 2 3 4 5; do
                code="$(curl -sSL -o /tmp/erp-response -w '%{http_code}' --connect-timeout 10 --max-time 35 "$base$endpoint" || true)"
                if test "$code" != 000 && test "$code" != 500 && test "$code" != 503; then break; fi
                sleep 3
              done
              echo "HOST=$base PATH=$endpoint HTTP=$code"
              if test "$endpoint" = /api/alerts/in-app; then
                test "$code" = 401
              else
                test "$code" = 200
              fi
              if test "$endpoint" = /api/health; then
                grep -q '"ok":true' /tmp/erp-response
              fi
              if test "$endpoint" = /login; then
                grep -q 'MYNH ERP' /tmp/erp-response
              fi
            done
          done
      - name: Release evidence
        shell: bash
        run: |
          {
            echo '## MYNH ERP V5 Phase 1: SKU catalog and warehouse semantic badges'
            echo "- Main SHA deployed: $GITHUB_SHA"
            echo '- Merged PR #93 b15b2888345c9529b3dae97d0c387a5e2a8a3aee'
            echo '- Merged PR #94 216907e080ff25300fe2b2664d1758fc9d52b5cb'
            echo '- SQL 0078 applied and verified before release; SQL 0079 NOT applied'
            echo '- Cloudflare Worker: mynh-erp-v5 ONLY'
            echo '- Preview continues read-only; tracking/notification/proxy Workers unchanged'
            echo '- Static QA, TypeScript, OpenNext build and HTTP smoke PASS'
            echo '- Authenticated SKU write E2E still requires separate controlled test'
          } >> "$GITHUB_STEP_SUMMARY"
