name: Table row marking and highlight rules - safe QA
on:
  push:
    branches: [design/table-row-flags-highlights-20261111]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: table-row-markings-qa
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PGPASSWORD: postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert phase 3 is isolated from Production
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/design/table-row-flags-highlights-20261111
          node - <<'NODE'
          const cfg=JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8'))
          if(cfg.name!=='mynh-erp-v5'||cfg.vars.ERP_TABLE_MARKINGS_LIVE!=='false'||
             cfg.vars.ERP_SKU_CATALOG_LIVE!=='true'||
             cfg.previews.vars.ERP_TABLE_MARKINGS_LIVE!=='false'||
             cfg.previews.vars.ERP_TABLE_MARKINGS_PREVIEW_UI!=='true'||
             cfg.previews.vars.ERP_WAREHOUSE_V2_LIVE!=='false'){
            throw Error('Unsafe feature gate or existing SKU regression')
          }
          console.log('PASS: Production marking remains OFF, Preview is read-only')
          NODE
      - name: Install dependencies and TypeScript check
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
      - name: Warehouse contracts and pure rule engine
        run: |
          node scripts/warehouse-intake-preview-contract-qa.mjs
          node scripts/warehouse-bulk-action-qa.mjs
          node scripts/table-row-highlights-rule-qa.mjs
      - name: PostgreSQL isolated RLS and audited flag test
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -X -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f scripts/warehouse-item-level-db-fixture.sql \
            -f supabase/migrations/0080_table_row_markings_and_rules.sql \
            -f scripts/table-row-markings-db-qa.sql 2>&1 | tee table-row-markings-db-qa.log
          grep -q 'PASS: personal pin/color RLS' table-row-markings-db-qa.log
      - name: Responsive Playwright marking UI
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright esbuild --no-audit --no-fund
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          CHROME_BIN="$CHROME_PATH" node scripts/table-row-markings-browser-qa.mjs
      - name: Build OpenNext without Production deployment
        run: npx opennextjs-cloudflare build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: table-markings-rls-and-ui-qa
          path: table-row-markings-db-qa.log
          if-no-files-found: ignore
          retention-days: 7
