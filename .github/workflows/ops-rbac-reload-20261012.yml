name: MYNH ERP Focused RBAC Persistence QA
on:
  push:
    branches: [qa/rbac-reload-20261012]
permissions:
  contents: read
concurrency:
  group: ops-rbac-reload-20261012
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PREVIEW_URL: https://ops-full-qa-v1-mynh-erp-v5.mynh-forwork.workers.dev
      SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
      SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_HNOcPFxwK51DKxAmy5fQhw_89dNfMOS' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Create temporary QA account
        run: node scripts/preview-auth-setup.mjs
      - name: Create uniquely tagged QA business fixtures
        run: node scripts/preview-fixture-setup.mjs
      - name: Install Chrome
        run: |
          npm install --no-save playwright --no-audit --no-fund
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_BIN=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: QA database persistence after reload and role access
        run: node scripts/ops-rbac-reload-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-rbac-reload-${{ github.sha }}
          path: qa-rbac-reload-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Cleanup unique QA records
        if: always()
        run: node scripts/preview-fixture-cleanup.mjs
      - name: Cleanup QA account
        if: always()
        run: node scripts/preview-auth-cleanup.mjs
