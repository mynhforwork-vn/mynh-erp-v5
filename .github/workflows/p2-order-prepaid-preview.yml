name: P2 Prepaid Purchase Order QA

on:
  push:
    branches:
      - feat/order-prepaid-account-card-20261011

permissions:
  contents: read

concurrency:
  group: p2-prepaid-orders-preview
  cancel-in-progress: true

jobs:
  prepaid-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Payment business and security contracts
        run: node --experimental-strip-types scripts/order-prepaid-qa.mjs
      - name: P1 and P0 regression
        run: |
          node --experimental-strip-types scripts/table-platform-p0-qa.mjs
          node --experimental-strip-types scripts/p1-purchase-static-qa.mjs
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: OpenNext build
        run: npx opennextjs-cloudflare build
      - name: Publish isolated P2 Preview
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler preview --name order-prepaid-p2-v1 --worker-name mynh-erp-v5 --message "P2 prepaid order $GITHUB_SHA" --json > p2-preview.json
      - name: Smoke P2 Preview
        run: |
          URL="https://order-prepaid-p2-v1-mynh-erp-v5.mynh-forwork.workers.dev"
          test "$(curl --silent --show-error --max-time 25 -o p2-health.json -w '%{http_code}' "$URL/api/health")" = "200"
          grep -q '"ok":true' p2-health.json
          test "$(curl --silent --show-error --max-time 25 -o p2-login.html -w '%{http_code}' "$URL/login")" = "200"
      - name: Create temporary QA login
        env:
          SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
          SUPABASE_KEY: sb_publishable_HNOcPFxwK51DKxAmy5fQhw_89dNfMOS
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/preview-auth-setup.mjs
      - name: Create isolated QA fixture
        env:
          SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/preview-fixture-setup.mjs
      - name: Install Chrome QA
        run: |
          npm install --no-save playwright --no-audit --no-fund
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_BIN=$CHROME_PATH" >> "$GITHUB_ENV"
      # P1 full-browser regression was already 204/204 at prior PR62 HEAD.
      # This isolated change only affects the purchase payment fields: run
      # the focused responsive create/edit/DB-persistence Chrome E2E below.
      - name: Chrome payment create-edit-reload E2E
        env:
          PREVIEW_URL: https://order-prepaid-p2-v1-mynh-erp-v5.mynh-forwork.workers.dev
          SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
          SUPABASE_KEY: sb_publishable_HNOcPFxwK51DKxAmy5fQhw_89dNfMOS
        run: node scripts/order-prepaid-e2e.mjs
      - name: Chrome QA — purchase account filters and order column manager
        env:
          PREVIEW_URL: https://order-prepaid-p2-v1-mynh-erp-v5.mynh-forwork.workers.dev
          SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
          SUPABASE_KEY: sb_publishable_HNOcPFxwK51DKxAmy5fQhw_89dNfMOS
        run: node scripts/purchase-filter-columns-e2e.mjs
      # The main shared QA Preview from PR59/PR60/PR61 is updated only after
      # the payment and both purchase UI Chrome suites pass. Production is untouched.
      - name: Publish verified build to main Tracking/Purchase Preview
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler preview --name tracking-kpi-v1 --worker-name mynh-erp-v5 --message "Purchase P2 integrated main preview $GITHUB_SHA" --json > integrated-preview.json
      - name: Smoke main Tracking/Purchase Preview
        run: |
          URL="https://tracking-kpi-v1-mynh-erp-v5.mynh-forwork.workers.dev"
          test "$(curl --silent --show-error --max-time 25 -o integrated-health.json -w '%{http_code}' "$URL/api/health")" = "200"
          grep -q '"ok":true' integrated-health.json
          test "$(curl --silent --show-error --max-time 25 -o integrated-login.html -w '%{http_code}' "$URL/login")" = "200"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-prepaid-orders-${{ github.sha }}
          path: |
            qa-p1-purchase-artifacts/
            qa-order-prepaid-artifacts/
            qa-purchase-filter-columns-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Cleanup isolated QA fixtures
        if: always()
        env:
          SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/preview-fixture-cleanup.mjs
      - name: Cleanup temporary QA user
        if: always()
        env:
          SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/preview-auth-cleanup.mjs
