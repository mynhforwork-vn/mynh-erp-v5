name: MYNH ERP Production v229 Mirror Smoke Check
on:
  push:
    branches:
      - qa/integrated-notifications-tracking-20261016
    paths:
      - '.github/workflows/mynh-production-v229-mirror-preview-cleanup.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_URL: https://mynh-erp-v5.mynh-forwork.workers.dev
      MIRROR_URL: https://production-v229-mirror-20261016-mynh-erp-v5.mynh-forwork.workers.dev
    steps:
      - name: Verify deployed Production is still 100 percent v229
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
           "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/mynh-erp-v5/deployments?page=1&per_page=1" > live.json
          jq -e '.success and (.result.deployments[0].versions|length)==1 and
            .result.deployments[0].versions[0].version_id=="cc54593b-6aad-4ec1-a354-2d72f99f1a97" and
            .result.deployments[0].versions[0].percentage==100' live.json
      - name: Verify the already deployed Production-source mirror exists
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
           "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/mynh-erp-v5/previews?page=1&per_page=100" > previews.json
          jq -e '.success and ([.result[]|select(.name=="production-v229-mirror-20261016" and .deployed_on!=null)]|length)==1' previews.json
      - name: Compare health and login via real HTTP on both URLs
        shell: bash
        run: |
          set -euo pipefail
          for url in "$PROD_URL" "$MIRROR_URL"; do
            code="$(curl -sS -L --retry 2 --retry-delay 2 --max-time 35 -o health.json -w '%{http_code}' "$url/api/health")"
            test "$code" = "200"
            jq -e '.ok==true' health.json
            code="$(curl -sS -L --retry 2 --retry-delay 2 --max-time 35 -o login.html -w '%{http_code}' "$url/login")"
            test "$code" = "200"
            code="$(curl -sS -L --retry 2 --retry-delay 2 --max-time 35 -o unauthorized.json -w '%{http_code}' "$url/api/alerts/in-app")"
            test "$code" = "401"
            echo "HTTP smoke OK: $url"
          done
