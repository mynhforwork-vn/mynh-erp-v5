name: ERP Auto Tracking — Telegram Off QA

on:
  push:
    branches:
      - fix/erp-auto-tracking-disable-telegram-20261012
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-auto-tracking-telegram-off-qa
  cancel-in-progress: true

jobs:
  telegram-off:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify pinned Production Worker and build isolated candidate
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/worker-telegram-off-build.mjs
      - name: Check Worker JavaScript syntax
        run: node --check qa-worker-artifacts/erp-auto-tracking-telegram-off.mjs
      - name: Test retired Telegram endpoints and preserved Tracking
        run: node scripts/worker-telegram-off-qa.mjs
      - name: Upload audited candidate and manifest (no Production deployment)
        uses: actions/upload-artifact@v4
        with:
          name: erp-auto-tracking-telegram-off-${{ github.sha }}
          path: qa-worker-artifacts/
          retention-days: 7
          if-no-files-found: error
