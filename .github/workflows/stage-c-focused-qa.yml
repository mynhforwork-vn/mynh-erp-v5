name: Stage C — Focused RBAC Finance QR QA

on:
  push:
    branches:
      - qa/stage-c-interaction-20261012
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-c-focused-20261012
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
      SUPABASE_KEY: sb_publishable_HNOcPFxwK51DKxAmy5fQhw_89dNfMOS
      PREVIEW_URL: https://erp-stage-c-interactions-mynh-erp-v5.mynh-forwork.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies without production mutation
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Verify pinned Preview commit (no Cloudflare deployment)
        run: |
          node --input-type=module <<'NODE'
          const id='aa85945107ec49e7bee6e781a50f76f4'
          const path='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/workers/mynh-erp-v5/previews/'+id+'/deployments'
          const r=await fetch(path,{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}})
          if(!r.ok)throw Error('Cannot verify Preview deployment: '+r.status)
          const j=await r.json()
          if(!j.success||j.result?.[0]?.annotations?.['workers/commit_sha']!=='efdf63bbaaceb9d60f744e1d89addb67efb2c409')throw Error('Pinned Preview differs')
          console.log('STAGE_C_PREVIEW_PINNED validated; no Production deploy')
          NODE
          test "$(curl -fsS --max-time 20 -o /tmp/qa-health.json -w '%{http_code}' "$PREVIEW_URL/api/health")" = 200
      - name: Create temporary QA user
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/preview-auth-setup.mjs
      - name: Create uniquely labelled QA fixtures
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/preview-fixture-setup.mjs
      - name: Prepare headless browser
        run: |
          npm install --no-save playwright --no-audit --no-fund
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_BIN=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Three-role RLS backend and authenticated UI diagnostic
        id: rbac
        continue-on-error: true
        timeout-minutes: 16
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/stage-c-rbac-focused-qa.mjs
      - name: Finance date and VietQR unit/UI tests
        id: finance
        continue-on-error: true
        timeout-minutes: 12
        run: node --experimental-strip-types scripts/stage-c-finance-qr-qa.mjs
      - name: Aggregate focused gate
        if: always()
        run: |
          echo "RBAC: ${{ steps.rbac.outcome }}"
          echo "Finance/QR: ${{ steps.finance.outcome }}"
          test "${{ steps.rbac.outcome }}" = success
          test "${{ steps.finance.outcome }}" = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-c-rbac-finance-qa-${{ github.sha }}
          path: qa-stage-c-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Cleanup only labelled fixtures
        if: always()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/preview-fixture-cleanup.mjs
      - name: Cleanup disposable test login
        if: always()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/preview-auth-cleanup.mjs
