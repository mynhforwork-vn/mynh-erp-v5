name: Integrated Pre-Merge QA — MYNH ERP V5

on:
  push:
    branches:
      - qa/premerge-main-v5-20261012

permissions:
  contents: read

concurrency:
  group: integrated-premerge-main-v5
  cancel-in-progress: true

jobs:
  integrated-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Pre-merge static business, security and table regression
        run: |
          node scripts/remediation-static-qa.mjs
          node --experimental-strip-types scripts/table-platform-p0-qa.mjs
          node --experimental-strip-types scripts/p1-purchase-static-qa.mjs
          node --experimental-strip-types scripts/order-prepaid-qa.mjs
          node --experimental-strip-types scripts/tracking-transit-compact-qa.mjs
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Cloudflare OpenNext build
        run: npx opennextjs-cloudflare build
      - name: Publish ISOLATED integrated pre-merge Preview (never Production)
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler preview --name premerge-main-v5-20261012 --worker-name mynh-erp-v5 --message "Integrated pre-merge audit $GITHUB_SHA" --json > premerge-preview.json
      - name: Preview health/login smoke
        run: |
          URL="https://premerge-main-v5-20261012-mynh-erp-v5.mynh-forwork.workers.dev"
          test "$(curl --silent --show-error --max-time 25 -o health.json -w '%{http_code}' "$URL/api/health")" = "200"
          grep -q '"ok":true' health.json
          test "$(curl --silent --show-error --max-time 25 -o login.html -w '%{http_code}' "$URL/login")" = "200"
      - name: Prepare temporary authenticated QA session
        env:
          SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
          SUPABASE_KEY: sb_publishable_HNOcPFxwK51DKxAmy5fQhw_89dNfMOS
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/preview-auth-setup.mjs
      - name: Create isolated QA fixtures
        env:
          SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/preview-fixture-setup.mjs
      - name: Install Chrome QA
        run: |
          npm install --no-save playwright --no-audit --no-fund
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_BIN=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: FULL P1 browser regression — User, Orders, Tracking, slidebars
        env:
          PREVIEW_URL: https://premerge-main-v5-20261012-mynh-erp-v5.mynh-forwork.workers.dev
          SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
          SUPABASE_KEY: sb_publishable_HNOcPFxwK51DKxAmy5fQhw_89dNfMOS
        run: node scripts/p1-purchase-tables-qa.mjs
      - name: P2 payment and COD create/edit DB persistence browser E2E
        env:
          PREVIEW_URL: https://premerge-main-v5-20261012-mynh-erp-v5.mynh-forwork.workers.dev
          SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
          SUPABASE_KEY: sb_publishable_HNOcPFxwK51DKxAmy5fQhw_89dNfMOS
        run: node scripts/order-prepaid-e2e.mjs
      - name: Purchase account filters and order column controls E2E
        env:
          PREVIEW_URL: https://premerge-main-v5-20261012-mynh-erp-v5.mynh-forwork.workers.dev
          SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
          SUPABASE_KEY: sb_publishable_HNOcPFxwK51DKxAmy5fQhw_89dNfMOS
        run: node scripts/purchase-filter-columns-e2e.mjs
      - name: Tracking live slidebar Chrome regression
        env:
          PREVIEW_URL: https://premerge-main-v5-20261012-mynh-erp-v5.mynh-forwork.workers.dev
          SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
          SUPABASE_KEY: sb_publishable_HNOcPFxwK51DKxAmy5fQhw_89dNfMOS
        run: node scripts/tracking-slidebars-qa.mjs
      - name: Tracking responsive table Chrome regression
        env:
          PREVIEW_URL: https://premerge-main-v5-20261012-mynh-erp-v5.mynh-forwork.workers.dev
          SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
          SUPABASE_KEY: sb_publishable_HNOcPFxwK51DKxAmy5fQhw_89dNfMOS
        run: node scripts/tracking-responsive-tables-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-premerge-${{ github.sha }}
          path: |
            qa-p1-purchase-artifacts/
            qa-order-prepaid-artifacts/
            qa-purchase-filter-columns-artifacts/
            qa-tracking-slidebars-artifacts/
            qa-tracking-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Cleanup isolated QA fixtures
        if: always()
        env:
          SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/preview-fixture-cleanup.mjs
      - name: Cleanup temporary QA user
        if: always()
        env:
          SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/preview-auth-cleanup.mjs
