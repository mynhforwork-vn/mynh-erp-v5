name: Warehouse native design QA - read-only Preview
on:
  push:
    branches: [design/warehouse-intake-native-20261105]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: warehouse-native-design-preview
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/warehouse-native-design-qa.mjs
      - run: npm run typecheck
      - run: npm run build
  preview:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check preview credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: npm install --no-audit --no-fund
      - name: Build OpenNext
        run: npx opennextjs-cloudflare build
      - name: Publish isolated Preview, not Production
        id: publish
        run: |
          npx wrangler preview --name warehouse-native-qa --worker-name mynh-erp-v5 --message "Warehouse native design $GITHUB_SHA" --json > preview.json
          node - <<'NODE'
          const fs=require('node:fs')
          const raw=fs.readFileSync('preview.json','utf8')
          let obj
          try{obj=JSON.parse(raw)}catch{
            const i=raw.indexOf('{'),j=raw.lastIndexOf('}')
            if(i<0||j<=i)throw new Error('Cannot find preview response')
            obj=JSON.parse(raw.slice(i,j+1))
          }
          const urls=[]
          const visit=x=>{
            if(!x)return
            if(typeof x==='string'&&/^https:\/\//.test(x))urls.push(x)
            else if(Array.isArray(x))x.forEach(visit)
            else if(typeof x==='object')Object.values(x).forEach(visit)
          }
          visit(obj)
          const url=urls.find(x=>x.includes('workers.dev'))||urls[0]
          if(!url)throw new Error('No preview URL found')
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'url='+url+'\n')
          console.log('Preview URL: '+url)
          NODE
      - name: Smoke health and login without data writes
        env:
          PREVIEW_URL: ${{ steps.publish.outputs.url }}
        run: |
          curl --fail --silent --show-error --retry 3 "$PREVIEW_URL/api/health" > health.json
          grep -q '"ok":true' health.json
          code="$(curl -sS -o login.html -w '%{http_code}' "$PREVIEW_URL/login")"
          test "$code" = "200"
          grep -q 'MYNH ERP' login.html
      - name: Report
        env:
          PREVIEW_URL: ${{ steps.publish.outputs.url }}
        run: |
          echo "Preview: $PREVIEW_URL/warehouse/receive" >> "$GITHUB_STEP_SUMMARY"
          echo "No changes to Production or Supabase schema" >> "$GITHUB_STEP_SUMMARY"
          echo "Authenticated UI QA not yet verified" >> "$GITHUB_STEP_SUMMARY"
