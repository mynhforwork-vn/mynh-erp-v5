name: Cloudflare MYNH Worker Audit (Read Only)

on:
  push:
    branches:
      - audit/cloudflare-workers-v5

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect Cloudflare Workers without changes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token||!account) { console.log('CREDENTIALS_MISSING'); process.exit(0); }
          const targets=['mynh-erp-notify-v1','mynh-erp-v5','mynh-erp','erp-auto-tracking','ghn-proxy'];
          const root='https://api.cloudflare.com/client/v4';
          const safe=(x)=>JSON.stringify(x);
          async function api(path){
            try{
              const r=await fetch(root+path,{headers:{authorization:'Bearer '+token}});
              const j=await r.json().catch(()=>({}));
              return {http:r.status,success:!!j.success,result:j.result,code:j.errors?.[0]?.code??null};
            }catch{return {http:0,success:false,code:'NETWORK_ERROR'};}
          }
          const listed=await api('/accounts/'+account+'/workers/scripts');
          const scripts=Array.isArray(listed.result)?listed.result:[];
          console.log('INVENTORY '+safe({status:listed.http,success:listed.success,list_count:scripts.length,
            target_present:targets.map(x=>({name:x,present:scripts.some(y=>y.id===x)}))}));
          for(const name of targets){
            const entry=scripts.find(x=>x.id===name);
            const prefix='/accounts/'+account+'/workers/scripts/'+encodeURIComponent(name);
            const [settings,cron,subdomain]=await Promise.all([
              api(prefix+'/settings'),api(prefix+'/schedules'),api(prefix+'/subdomain')
            ]);
            const bs=Array.isArray(settings.result?.bindings)?settings.result.bindings:[];
            const services=bs.filter(b=>b.type==='service'||b.type==='dispatch_namespace')
              .map(b=>({type:b.type,service:b.service??null,environment:b.environment??null}));
            const types=bs.reduce((o,b)=>(o[b.type]=(o[b.type]||0)+1,o),{});
            console.log('WORKER '+safe({name,list_present:!!entry,created:entry?.created_on??null,
              modified:entry?.modified_on??null,settings_http:settings.http,setting_types:types,
              service_bindings:services,cron_http:cron.http,
              cron:Array.isArray(cron.result?.schedules)?cron.result.schedules.map(x=>x.cron):null,
              subdomain_http:subdomain.http,subdomain_enabled:subdomain.result?.enabled??null}));
            // Never output Worker source, secret names, secret values, or environment values.
            try {
              const r=await fetch(root+prefix,{headers:{authorization:'Bearer '+token}});
              const source=r.ok?await r.text():'';
              console.log('SOURCE_FLAGS '+safe({name,http:r.status,readable:r.ok,
                links_to_old_erp:source.includes('mynh-erp.mynh-forwork.workers.dev'),
                links_to_tracking:source.includes('erp-auto-tracking'),
                links_to_ghn_proxy:source.includes('ghn-proxy'),
                references_ghn:source.toLowerCase().includes('ghn'),
                references_spx:source.toLowerCase().includes('spx.vn'),
                references_telegram:source.toLowerCase().includes('api.telegram.org')
              }));
            } catch{console.log('SOURCE_FLAGS '+safe({name,readable:false}));}
          }
          const day=new Date();
          const currentStart=new Date(Date.UTC(day.getUTCFullYear(),day.getUTCMonth(),day.getUTCDate()));
          const periods=[{label:'last_complete_utc_day',start:new Date(currentStart.getTime()-86400000),end:currentStart},
            {label:'current_utc_day_partial',start:currentStart,end:day}];
          const query="query($accountTag: string, $start: string, $end: string){viewer{accounts(filter:{accountTag:$accountTag}){workersInvocationsAdaptive(limit:10000,filter:{datetime_geq:$start,datetime_lt:$end}){dimensions{scriptName} sum{requests errors subrequests}}}}}";
          for(const period of periods){
            try{
              const r=await fetch(root+'/graphql',{method:'POST',
                headers:{authorization:'Bearer '+token,'content-type':'application/json'},
                body:JSON.stringify({query,variables:{accountTag:account,start:period.start.toISOString(),end:period.end.toISOString()}})});
              const json=await r.json();
              const group=json.data?.viewer?.accounts?.[0]?.workersInvocationsAdaptive;
              if(!Array.isArray(group)){
                console.log('ANALYTICS '+safe({period:period.label,http:r.status,available:false,
                  error_count:json.errors?.length||0,notes:'Analytics permission or GraphQL schema may be unavailable'}));
                continue;
              }
              const sums=group.reduce((m,e)=>{
                const n=e.dimensions?.scriptName||'(unnamed)';
                const v=m[n]||(m[n]={requests:0,errors:0,subrequests:0});
                for(const f of ['requests','errors','subrequests'])v[f]+=Number(e.sum?.[f]||0);
                return m;
              },{});
              console.log('ANALYTICS '+safe({period:period.label,http:r.status,available:true,
                from:period.start.toISOString(),to:period.end.toISOString(),
                group_count:group.length,groups:sums}));
            }catch {console.log('ANALYTICS '+safe({period:period.label,available:false,notes:'FETCH_ERROR'}));}
          }
          const telemetry='/accounts/'+account+'/workers/observability/telemetry/keys';
          try{
            const r=await fetch(root+telemetry,{method:'POST',headers:{authorization:'Bearer '+token,'content-type':'application/json'},body:'{}'});
            const j=await r.json();
            console.log('TELEMETRY_KEYS '+JSON.stringify({http:r.status,success:j.success,
              keys:(Array.isArray(j.result)?j.result:[]).map(x=>x.key).filter(x=>/url|method|status|service|origin|trigger|request|path/i.test(x)).slice(0,60),
              errorCodes:(j.errors||[]).map(e=>e.code||'UNKNOWN')}));
          }catch{console.log('TELEMETRY_KEYS ERROR');}
          for(const name of ['mynh-erp-v5','mynh-erp-notify-v1']){
            try{
              const response=await fetch('https://'+name+'.mynh-forwork.workers.dev/api/health');
              const raw=(await response.text()).slice(0,3000);
              console.log('SITE_PROBE '+JSON.stringify({name,status:response.status,cloudflareCode:(raw.match(/(?:error\s*code|code)[^\d]{0,50}(10\d\d)/i)||[])[1]||null,
                mentionsDailyLimit:/daily|quota|limit exceeded|free tier/i.test(raw),mentionsRateLimit:/rate limit|too many requests/i.test(raw)}));
            }catch{console.log('SITE_PROBE '+JSON.stringify({name,unreachable:true}));}
          }
          const subscription=await api('/accounts/'+account+'/workers/subscription');
          console.log('SUBSCRIPTION '+JSON.stringify({http:subscription.http,success:subscription.success,
            plan:subscription.result?.plan?.id??subscription.result?.plan?.name??subscription.result?.name??null}));
          for(const [label,start,end] of [
            ['utc07_00_06',Date.parse('2026-10-07T00:00:00Z'),Date.parse('2026-10-07T06:00:00Z')],
            ['utc07_06_12',Date.parse('2026-10-07T06:00:00Z'),Date.parse('2026-10-07T12:00:00Z')],
            ['utc07_12_18',Date.parse('2026-10-07T12:00:00Z'),Date.parse('2026-10-07T18:00:00Z')],
            ['utc07_18_24',Date.parse('2026-10-07T18:00:00Z'),Date.parse('2026-10-08T00:00:00Z')],
            ['utc08_00_06',Date.parse('2026-10-08T00:00:00Z'),Date.parse('2026-10-08T06:00:00Z')],
            ['utc08_06_12',Date.parse('2026-10-08T06:00:00Z'),Date.parse('2026-10-08T12:00:00Z')],
            ['utc08_12_18',Date.parse('2026-10-08T12:00:00Z'),Date.now()]
          ]){
            const vars={accountTag:account,start:new Date(start).toISOString(),end:new Date(end).toISOString()};
            const r=await fetch(root+'/graphql',{method:'POST',headers:{authorization:'Bearer '+token,'content-type':'application/json'},body:JSON.stringify({query,variables:vars})});
            const j=await r.json();
            const rows=j.data?.viewer?.accounts?.[0]?.workersInvocationsAdaptive||[];
            console.log('PERIOD_COUNTS '+JSON.stringify({label,ok:Array.isArray(rows),totals:rows.map(x=>({
              name:x.dimensions?.scriptName,requests:x.sum?.requests,errors:x.sum?.errors}))}));
          }
          NODE
