name: P1 Purchase Tables Named Preview QA

on:
  push:
    branches:
      - feat/p1-purchase-tables-20261011

permissions:
  contents: read

concurrency:
  group: p1-purchase-tables-preview
  cancel-in-progress: true

jobs:
  purchase-tables:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: P0 preference regression
        run: node --experimental-strip-types scripts/table-platform-p0-qa.mjs
      - name: P1 Purchase behavior contract
        run: node --experimental-strip-types scripts/p1-purchase-static-qa.mjs
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Cloudflare OpenNext build
        run: npx opennextjs-cloudflare build
      - name: Publish isolated P1 Named Preview (not Production)
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler preview --name purchase-tables-p1-v1 --worker-name mynh-erp-v5 --message "P1 purchase tables QA $GITHUB_SHA" --json > p1-named-preview.json
          echo "P1_PREVIEW=https://purchase-tables-p1-v1-mynh-erp-v5.mynh-forwork.workers.dev"
      - name: Smoke isolated P1 Preview
        shell: bash
        run: |
          URL="https://purchase-tables-p1-v1-mynh-erp-v5.mynh-forwork.workers.dev"
          code=$(curl --silent --show-error --max-time 20 -o health.json -w '%{http_code}' "$URL/api/health")
          echo "P1_HEALTH_HTTP=$code"
          test "$code" = "200"
          grep -q '"ok":true' health.json
          code=$(curl --silent --show-error --max-time 20 -o login.html -w '%{http_code}' "$URL/login")
          echo "P1_LOGIN_HTTP=$code"
          test "$code" = "200"
      - name: Create temporary QA login
        env:
          SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
          SUPABASE_KEY: sb_publishable_HNOcPFxwK51DKxAmy5fQhw_89dNfMOS
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/preview-auth-setup.mjs
      - name: Create isolated QA fixture
        env:
          SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/preview-fixture-setup.mjs
      - name: Set up Chrome for browser QA
        shell: bash
        run: |
          npm install --no-save playwright --no-audit --no-fund
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_BIN=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Browser QA — Purchase Accounts, Orders and Tracking regression
        env:
          PREVIEW_URL: https://purchase-tables-p1-v1-mynh-erp-v5.mynh-forwork.workers.dev
          SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
          SUPABASE_KEY: sb_publishable_HNOcPFxwK51DKxAmy5fQhw_89dNfMOS
        run: node scripts/p1-purchase-tables-qa.mjs
      # P1 is stacked on P0 (#60) and Tracking (#59).
      # Only replace the old Tracking Named Preview AFTER P1 Chrome QA passes.
      # No Production route/Worker is deployed or altered.
      - name: Publish QA-verified P1 to original PR59 Tracking Preview URL
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler preview --name tracking-kpi-v1 --worker-name mynh-erp-v5 --message "PR61 P1 on PR60/PR59 $GITHUB_SHA" --json > p1-tracking-preview.json
          echo "P1_ON_ORIGINAL_TRACKING_PREVIEW=https://tracking-kpi-v1-mynh-erp-v5.mynh-forwork.workers.dev"
      - name: Verify P1 is serving on original PR59 Tracking Preview
        shell: bash
        run: |
          BASE="https://tracking-kpi-v1-mynh-erp-v5.mynh-forwork.workers.dev"
          code=$(curl --silent --show-error --max-time 25 -o p1-tracking-health.json -w '%{http_code}' "$BASE/api/health")
          echo "P1_TRACKING_HEALTH_HTTP=$code"
          test "$code" = "200"
          grep -q '"ok":true' p1-tracking-health.json
          code=$(curl --silent --show-error --max-time 25 -o p1-tracking-login.html -w '%{http_code}' "$BASE/login")
          echo "P1_TRACKING_LOGIN_HTTP=$code"
          test "$code" = "200"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-purchase-tables-${{ github.sha }}
          path: qa-p1-purchase-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Cleanup isolated QA fixtures
        if: always()
        env:
          SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/preview-fixture-cleanup.mjs
      - name: Cleanup temporary QA user
        if: always()
        env:
          SUPABASE_URL: https://nvgxwqapfaslavhtpauh.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/preview-auth-cleanup.mjs
